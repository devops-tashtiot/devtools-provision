# Base values — DB connection, Bitbucket forge credentials, ingress host,
# and resource requests/limits are overridden in devtools-definition.

woodpecker:
  agent:
    replicaCount: 2

  server:
    statefulSet:
      replicaCount: 1

    env:
      WOODPECKER_ADMIN: "admin"
      WOODPECKER_DATABASE_DRIVER: postgres
      # Any authenticated Bitbucket user can log in and register their own
      # repos, not just the WOODPECKER_ADMIN account above — Woodpecker's
      # default (registration closed to everyone but the admin) was too
      # restrictive for this platform's shared Bitbucket instance, where
      # multiple accounts (svc-devops-tashtiot, personal logins, ...)
      # legitimately need to use CI without being full Woodpecker admins.
      WOODPECKER_OPEN: "true"

    # Rendered by this umbrella chart's own templates/secrets.yaml — same
    # Secret names in every environment, so wired here rather than
    # duplicated in devtools-definition.
    extraSecretNamesForEnvFrom:
      - woodpecker-db
      - woodpecker-bitbucket-dc

# Values consumed only by this umbrella chart's own templates/ (not passed to
# the woodpecker subchart) — kept under "wrapper" so they never collide with
# the woodpecker subchart's own top-level keys above.
wrapper:
  # RDS master credentials (SSM SecureString paths) — used by the
  # additionalInitContainer (see devtools-definition) that ensures this
  # tool's database exists on the shared RDS instance, and by the
  # woodpecker-db ExternalSecret below. Requires the external-secrets-operator
  # devtool. Set in devtools-definition.
  rdsAdmin:
    usernameSsmParameter: ""
    passwordSsmParameter: ""

  # Non-secret half of the Postgres connection string. Combined with the RDS
  # admin username/password above into a single WOODPECKER_DATABASE_DATASOURCE
  # env var by the woodpecker-db ExternalSecret's templated target (see
  # templates/secrets.yaml) — Woodpecker takes one connection-string env var
  # rather than the separate url/username/password fields the Atlassian
  # charts accept. host is set in devtools-definition once the RDS address
  # is known.
  database:
    host: ""
    port: 5432
    name: "woodpecker"

  # Bitbucket Data Center forge integration (see templates/secrets.yaml).
  # Woodpecker's Bitbucket DC support requires an Application Link
  # registered by hand in Bitbucket's admin UI (Administration > Application
  # Links > Create link > choose "External Application", direction
  # "Incoming", callback https://woodpecker.devopstashtiot.page/authorize) —
  # there's no REST API to automate that registration — plus a Bitbucket
  # "git machine account" username/password, since Bitbucket Server doesn't
  # support cloning over git+https with an OAuth token. Set in
  # devtools-definition.
  #
  # Bitbucket is reached at its public hostname, which in-cluster callers
  # resolve straight to ingress-nginx via the CoreDNS rewrites in
  # devtools-labs/terraform/modules/minikube/main.tf (bypassing Cloudflare
  # Access, which would otherwise 302 every machine-to-machine call to its
  # email-OTP login page). That path presents the real Cloudflare Origin CA
  # cert. Woodpecker's WOODPECKER_BITBUCKET_DC_SKIP_VERIFY only disables TLS
  # verification for git clone/API calls, not for the OAuth2 token exchange
  # (server/forge/bitbucketdatacenter has no SkipVerify field at all — see
  # https://github.com/woodpecker-ci/woodpecker/blob/v3.17.0/server/forge/bitbucketdatacenter/bitbucketdatacenter.go),
  # so it can't fix login. Instead the Cloudflare Origin CA root cert is
  # trusted properly, the same way argocd/bitbucket/jira/confluence/
  # artifactory already do (see trustedCertsSsmParameter below and
  # templates/trusted-certs.yaml) — no skip-verify anywhere.
  bitbucketDcSecrets:
    url: ""
    clientIdSsmParameter: ""
    clientSecretSsmParameter: ""
    gitUsername: ""
    gitPasswordSsmParameter: ""

  # SSM Parameter Store path (SecureString) holding the Cloudflare Origin CA
  # root cert — same value argocd/bitbucket/jira/confluence/artifactory's
  # trusted-certs.yaml already use. Synced by templates/trusted-certs.yaml
  # into a Secret, then combined with the image's own CA bundle by an
  # initContainer and mounted over /etc/ssl/certs/ca-certificates.crt (see
  # devtools-definition's server.initContainers/extraVolumes) — Woodpecker's
  # server image is FROM scratch with no shell to run update-ca-certificates
  # in-place, so the combined bundle has to be built by an init container
  # and mounted in whole. Requires the external-secrets-operator devtool.
  # Set in devtools-definition.
  trustedCertsSsmParameter: ""
