{{- if and .Values.wrapper.rdsAdmin.usernameSsmParameter .Values.wrapper.rdsAdmin.passwordSsmParameter }}
# Composes WOODPECKER_DATABASE_DATASOURCE from the shared RDS admin
# credentials via ESO's own templating — Woodpecker takes one
# connection-string env var rather than separate url/username/password
# fields like the Atlassian charts. The `{{ "{{ ... }}" }}` below is Helm
# emitting literal Go-template syntax for ESO's second templating pass, not
# a typo — Helm renders the quoted string as a constant without
# re-interpreting the braces inside it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-db
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: woodpecker-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WOODPECKER_DATABASE_DATASOURCE: "postgres://{{ "{{ .username }}" }}:{{ "{{ .password }}" }}@{{ .Values.wrapper.database.host }}:{{ .Values.wrapper.database.port | default 5432 }}/{{ .Values.wrapper.database.name | default "woodpecker" }}?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.wrapper.rdsAdmin.usernameSsmParameter | quote }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.wrapper.rdsAdmin.passwordSsmParameter | quote }}
---
{{- end }}
# Bitbucket Data Center forge integration — see values.yaml's
# wrapper.bitbucketDcSecrets comment for the manual Application Link
# registration this depends on.
apiVersion: v1
kind: Secret
metadata:
  name: woodpecker-bitbucket-dc
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  WOODPECKER_BITBUCKET_DC: "true"
  WOODPECKER_BITBUCKET_DC_URL: {{ .Values.wrapper.bitbucketDcSecrets.url | quote }}
  WOODPECKER_BITBUCKET_DC_GIT_USERNAME: {{ .Values.wrapper.bitbucketDcSecrets.gitUsername | quote }}
  WOODPECKER_BITBUCKET_DC_SKIP_VERIFY: {{ .Values.wrapper.bitbucketDcSecrets.skipVerify | toString | quote }}
---
{{- if .Values.wrapper.bitbucketDcSecrets.clientIdSsmParameter }}
# Patches the OAuth client id/secret and git machine-account password into
# the Secret above. creationPolicy: Merge only adds/updates these keys — it
# never owns or deletes the Secret, so it can't race the plain Secret
# manifest above it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-bitbucket-dc-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: woodpecker-bitbucket-dc
    creationPolicy: Merge
  data:
    - secretKey: WOODPECKER_BITBUCKET_DC_CLIENT_ID
      remoteRef:
        key: {{ .Values.wrapper.bitbucketDcSecrets.clientIdSsmParameter | quote }}
    - secretKey: WOODPECKER_BITBUCKET_DC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.wrapper.bitbucketDcSecrets.clientSecretSsmParameter | quote }}
    - secretKey: WOODPECKER_BITBUCKET_DC_GIT_PASSWORD
      remoteRef:
        key: {{ .Values.wrapper.bitbucketDcSecrets.gitPasswordSsmParameter | quote }}
{{- end }}
