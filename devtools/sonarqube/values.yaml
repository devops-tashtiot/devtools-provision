# Base values — DB URL and secrets are overridden in devtools-definition

sonarqube:
  replicaCount: 1

  image:
    repository: sonarqube
    tag: "25.6.0.109173-community"

  # Required so the chart doesn't demand a paid `edition` (developer/
  # enterprise) — image.tag above already pins the exact Community Build we
  # want, so community.buildNumber (the chart's own default-tag fallback) is
  # left unset.
  community:
    enabled: true

  # Embedded Postgres/nginx subcharts are disabled — this platform reuses the
  # shared devtools-rds instance (via jdbcOverwrite below) and the cluster's
  # own nginx-ingress (via a plain Ingress, not the bundled nginx subchart).
  postgresql:
    enabled: false
  nginx:
    enabled: false

  jdbcOverwrite:
    enabled: true
    # URL and username set in devtools-definition after RDS is provisioned
    jdbcUrl: ""
    jdbcUsername: ""
    jdbcSecretName: sonarqube-db
    jdbcSecretPasswordKey: password

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - name: sonarqube.devopstashtiot.page
      # Per-consumer wildcard — routes every {consumer}.sonarqube.devopstashtiot.page
      # to this same single instance (mirrors devtools-definition/devtools/argocd's
      # equivalent per-consumer wildcard gap/workaround; see app/v1/sonarqube/CLAUDE.md
      # in devops-api). Not real per-consumer isolation, just enough to exercise
      # _build_client()'s live code path end-to-end against a real backend.
      - name: "*.sonarqube.devopstashtiot.page"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

  # SonarQube Community Edition has no native OIDC/SAML support (that's an
  # Enterprise Edition feature) — sonar-auth-oidc is the community-maintained
  # plugin that adds generic OpenID Connect authentication to Community
  # Edition. OIDC settings themselves (issuer/clientId/secret/redirect) are
  # environment-specific — see devtools-definition/devtools/sonarqube.
  plugins:
    install:
      - "https://github.com/sonar-auth-oidc/sonar-auth-oidc/releases/download/v3.0.0/sonar-auth-oidc-plugin-3.0.0.jar"
      # sonarqube-community-branch-plugin adds branch/PR analysis to Community
      # Edition (an Enterprise-only feature natively). Unlike a normal plugin
      # it isn't a passive drop-in — it must be attached as a -javaagent to
      # both the Web and Compute Engine JVMs (see sonarProperties below), or
      # SonarQube ignores it. install_plugins.sh curls each URL fresh into
      # extensions/plugins/ on every start, saving it under the URL basename
      # (sonarqube-community-branch-plugin-25.5.0.jar) — the javaagent paths
      # below must match that exact filename.
      # NOTE: plugin 25.5.0 is built for the SonarQube 25.5 line; the image
      # above is 25.6.0.109173-community. The plugin rewrites SonarQube
      # bytecode and is version-sensitive, so a 25.5 → 25.6 skew may need a
      # matching plugin bump (26.5.0 is the next release) if startup fails.
      - "https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/25.5.0/sonarqube-community-branch-plugin-25.5.0.jar"

  # Env-invariant sonar.properties. The two javaAdditionalOpts attach the
  # community-branch-plugin jar (installed via plugins.install above) as a
  # -javaagent to the Web ("=web") and Compute Engine ("=ce") JVMs — the
  # plugin does nothing without them. The "./" is relative to SONARQUBE_HOME
  # (/opt/sonarqube), where install_plugins.sh drops the jar. These deep-merge
  # with the env-specific sonarProperties (OIDC settings) in devtools-definition.
  sonarProperties:
    sonar.web.javaAdditionalOpts: "-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-25.5.0.jar=web"
    sonar.ce.javaAdditionalOpts: "-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-25.5.0.jar=ce"

  persistence:
    enabled: true
    storageClass: gp2
    size: 10Gi

  resources:
    requests:
      cpu: 400m
      memory: 2048M
    limits:
      cpu: 800m
      memory: 3072M

  # Required for the readiness probe to ever succeed (chart requirement, not
  # a credential to an external system) — set in devtools-definition.
  monitoringPasscode: ""

  # Trusts the Cloudflare Origin CA root cert (see wrapper.trustedCertsSsmParameter
  # below and templates/trusted-certs.yaml) so SonarQube's own outbound OIDC
  # discovery/token calls to rhbk.devopstashtiot.page pass certificate
  # verification instead of failing with "PKIX path building failed".
  caCerts:
    enabled: true
    secret: sonarqube-trusted-certs

  # Bootstraps the admin password at container startup instead of the manual
  # setup wizard — SonarQube Community Edition supports this natively via a
  # Secret with "password"/"currentPassword" keys (unlike Jira, which has no
  # such mechanism at all). Secret populated in templates/secrets.yaml below.
  setAdminPassword:
    passwordSecretName: sonarqube-admin-password

# Values consumed only by this umbrella chart's own templates/ (not passed to
# the sonarqube subchart) — kept under "wrapper" so they never collide with
# the sonarqube subchart's own top-level key above.
wrapper:
  # SSM Parameter Store path (SecureString) holding the shared admin password
  # (plaintext) — patched into the sonarqube-admin-password Secret's "password"
  # key via an ExternalSecret. Requires the external-secrets-operator devtool.
  # Set in devtools-definition.
  adminPasswordSsmParameter: ""

  # RDS master credentials (SSM SecureString paths) — used only by the
  # extraInitContainers entry (see devtools-definition) that ensures this
  # tool's database exists on the shared RDS instance. Requires the
  # external-secrets-operator devtool. Set in devtools-definition.
  rdsAdmin:
    usernameSsmParameter: ""
    passwordSsmParameter: ""

  # RHBK-issued OIDC client secret for SonarQube (sonar-auth-oidc plugin) — see
  # templates/oidc-secret.yaml. Same shared SSM parameter
  # clusters-provision/clusters/rhbk's set-client-secrets-job.yaml reads to set
  # the actual secret on the RHBK side via the Admin API. Set in
  # devtools-definition.
  oidcClientSecretSsmParameter: ""

  # AD group (synced from RHBK's LDAP group-ldap-mapper) to grant SonarQube
  # admin to via sonar-auth-oidc's groupsSync — see
  # templates/provision-admin-group-job.yaml. Set in devtools-definition.
  adminGroup:
    name: ""

  # SSM Parameter Store path (SecureString) holding the Cloudflare Origin CA
  # root cert (PEM) — see templates/trusted-certs.yaml. Same shared value
  # published once by devtools-labs Terraform's devtools-secrets module and
  # consumed by every other JVM devtool's own trusted-certs.yaml. Set in
  # devtools-definition.
  trustedCertsSsmParameter: ""

  # Renders every dashboards/*.json file (see templates/dashboards.yaml) as a
  # Grafana-sidecar-discoverable ConfigMap — same mechanism as
  # devtools-provision/devtools/argocd. No dashboards/*.json committed yet:
  # SonarQube Community Edition has no native Prometheus metrics support
  # (that's gated behind Developer/Enterprise edition or a third-party
  # exporter, neither present here). Also requires kube-prometheus-stack to
  # be deployed (see devtools-provision/devtools/argocd/values.yaml's
  # grafanaDashboard note).
  grafanaDashboard:
    enabled: false
