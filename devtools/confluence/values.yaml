# Base values — DB URL, license path, and ingress host are overridden in devtools-definition

confluence:
  replicaCount: 1

  image:
    repository: atlassian/confluence
    # This platform hit a real, reproducible startup race repeatedly on
    # 2026-07-07 and again on 2026-08-31: submitting the setup wizard's
    # cluster-configuration step makes Confluence tear down and rebuild its
    # Spring/OSGi context live, in-process (no pod restart involved), and
    # any request landing in that rebuild window — including the browser's
    # own page load right after the form POST — hits "Spring Application
    # context has not been set" on every Soy-templated page (login, setup
    # wizard). It looks fatal but isn't: it self-resolves in roughly
    # 15-90 seconds if you just wait and reload once, without touching the
    # pod. Confirmed present identically across 9.3.1, 9.3.2, 9.4.1, and
    # 10.2.13 (chart bumped to 2.0.14 and back down again during that
    # testing) — it is not version-specific and no point/minor/major
    # release fixes it, so there's no reason to stay off 9.3.1 for this.
    # Reverted back to 9.3.1 on 2026-08-31 for that reason — see the full
    # "Lessons Learned" writeup at
    # https://devops-tashtiot.github.io (Confluence setup wizard card) and
    # devtools-labs/docs/post-devtools-implementation/confluence/README.md
    # for the wait-it-out procedure during setup.
    tag: "9.3.1"

  database:
    type: postgresql
    # URL set in devtools-definition after RDS is provisioned
    url: ""
    credentials:
      secretName: confluence-db
      usernameSecretKey: username
      passwordSecretKey: password

  ingress:
    create: true
    className: nginx
    nginx: true
    maxBodySize: 250m
    host: confluence.devopstashtiot.page
    https: false
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "250m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

  volumes:
    localHome:
      persistentVolumeClaim:
        create: true
        storageClassName: gp2
        resources:
          requests:
            storage: 10Gi
    sharedHome:
      persistentVolumeClaim:
        create: true
        # No accessModes override — falls back to the vendored chart's own
        # ReadWriteMany default (Atlassian's documented Data Center
        # "SHARED_STORAGE" pattern), matching Bitbucket's and Jira's
        # sharedHome — all three now use the EFS-backed StorageClass
        # (devtools-definition/devtools/confluence/values.yaml), which
        # supports RWX; plain EBS does not.
        storageClassName: gp2
        resources:
          requests:
            storage: 10Gi
    synchronyHome:
      persistentVolumeClaim:
        create: true
        storageClassName: gp2
        resources:
          requests:
            storage: 2Gi

  # Upstream chart quirk (same as devtools-provision/devtools/bitbucket/values.yaml):
  # some fields (license, resources, service, etc.) are read by the chart's own
  # templates as `.Values.confluence.<field>` (self-prefixed) instead of the
  # normal `.Values.<field>`. Helm strips the outer "confluence:" wrapper when
  # passing values down from this umbrella chart, so those specific fields
  # must be duplicated here to actually reach the subchart. Everything else
  # (database, volumes, ingress) resolves fine unprefixed.
  confluence:
    license:
      secretName: confluence-license
      secretKey: license-key

    resources:
      jvm:
        maxHeap: "1536m"
        minHeap: "1536m"
        reservedCodeCache: "256m"
      container:
        requests:
          cpu: 2000m
          memory: 2Gi
        limits:
          cpu: 3
          memory: 2.5Gi

    # Trusts the Cloudflare Origin CA root so Confluence's own outbound OIDC
    # token-exchange call to rhbk.devopstashtiot.page passes TLS verification
    # instead of failing with "PKIX path building failed" (same root cause and
    # fix as devtools-provision/devtools/bitbucket's/artifactory's
    # additionalCertificates — see templates/trusted-certs.yaml for the full
    # explanation).
    additionalCertificates:
      secretName: confluence-trusted-certs

    # Avisi Apps "User Directory API" — REST endpoints to list directories,
    # list users in a directory, and force an immediate sync against the
    # external user directory (see
    # marketplace.atlassian.com/plugins/nl.avisi.atlassian.confluence.user-directory-api).
    # Pinned jar version 1.1.9 requires Confluence Data Center 10.0.1-10.2.11;
    # this devtool currently runs 9.3.1 (see image.tag above) — wired in
    # anyway per explicit decision, but expect it may fail to load or
    # misbehave until Confluence is upgraded into that range.
    # The jar itself is fetched into shared-home/plugins by the
    # download-user-directory-api-plugin initContainer in
    # devtools-definition/devtools/confluence/values.yaml's
    # additionalInitContainers — that list lives in -definition (not here)
    # because Helm replaces, rather than merges, list-typed values across the
    # provision/definition value-file pair, and -definition already owns
    # that list for the ensure-postgres-db init container.
    additionalBundledPlugins:
      - volumeName: shared-home
        subDirectory: plugins
        fileName: nl.avisi.atlassian.confluence.user-directory-api-1.1.9.jar

  synchrony:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 1.5Gi

# Values consumed only by this umbrella chart's own templates/ (not passed to
# the confluence subchart) — kept under "wrapper" so they never collide with
# the confluence subchart's own top-level key above.
wrapper:
  # Secret placeholders — all overridden in devtools-definition
  confluenceSecrets:
    license: ""
    # SSM Parameter Store path for the license (SecureString). Used instead of
    # `license` above when set, via an ExternalSecret — keeps the license out
    # of git. Requires the external-secrets-operator devtool to be deployed.
    licenseSsmParameter: ""

  # RDS master credentials (SSM SecureString paths) — used only by the
  # additionalInitContainer (see devtools-definition) that ensures this tool's
  # database/role exist on the shared RDS instance. Requires the
  # external-secrets-operator devtool. Set in devtools-definition.
  rdsAdmin:
    usernameSsmParameter: ""
    passwordSsmParameter: ""

  # SSM Parameter Store path (SecureString) to Cloudflare's public Origin CA
  # root cert — same platform-wide value for every devtool, published once by
  # devtools-labs Terraform's devtools-secrets module. Set in devtools-definition.
  trustedCertsSsmParameter: ""

  # Renders every dashboards/*.json file (see templates/dashboards.yaml) as a
  # Grafana-sidecar-discoverable ConfigMap — same mechanism as
  # devtools-provision/devtools/argocd. No dashboards/*.json committed yet:
  # Confluence Data Center has no native Prometheus /metrics endpoint (would
  # need a JMX-to-Prometheus exporter sidecar, not deployed on this
  # platform). Also requires kube-prometheus-stack to be deployed (see
  # devtools-provision/devtools/argocd/values.yaml's grafanaDashboard note).
  grafanaDashboard:
    enabled: false
