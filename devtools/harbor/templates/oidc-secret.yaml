# Unlike ArgoCD (secretKeyRef-style field in its own oidc.config) or SonarQube
# (a sonar.properties-format file), Harbor has no chart-level OIDC field at
# all to merge this into — it's only consumed by configure-oidc-job.yaml's
# own curl call to Harbor's Configurations API, so this is a dedicated Secret
# rather than a Merge into something the subchart already owns.
#
# Same shared SSM parameter clusters-provision/clusters/rhbk's
# set-client-secrets-job.yaml reads to set the real value on the
# RHBK/Keycloak side (for this and every other client) — one source of
# truth, no manual sync needed.
{{- if .Values.wrapper.oidcClientSecretSsmParameter }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc-client-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: harbor-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.wrapper.oidcClientSecretSsmParameter | quote }}
{{- end }}
