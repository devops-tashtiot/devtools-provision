{{- if .Values.wrapper.bitbucketSecrets.license }}
apiVersion: v1
kind: Secret
metadata:
  name: bitbucket-license
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  license-key: {{ .Values.wrapper.bitbucketSecrets.license | quote }}
---
{{- else if .Values.wrapper.bitbucketSecrets.licenseSsmParameter }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitbucket-license
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: bitbucket-license
    creationPolicy: Owner
  data:
    - secretKey: license-key
      remoteRef:
        key: {{ .Values.wrapper.bitbucketSecrets.licenseSsmParameter | quote }}
---
{{- end }}
# No bitbucket-sysadmin Secret at all: Bitbucket's own one-time browser
# setup wizard now handles the admin username/password/displayName/email
# entirely, since bitbucket.sysadminCredentials is unset in values.yaml
# (see the comment there — the chart wires SETUP_SYSADMIN_USERNAME/
# PASSWORD/DISPLAYNAME/EMAILADDRESS as one atomic group, so partially
# pre-seeding isn't possible without also pre-seeding a password). A
# previous version of this Secret pre-seeded username/displayName/email and
# took a "password" key from an ExternalSecret — either patched via
# creationPolicy: Merge into this same plain Secret (raced with ArgoCD's own
# re-apply of the Secret's "data" map, which Server-Side Apply treats as
# atomic — ArgoCD's periodic sync repeatedly won the key back and wiped the
# merge, confirmed live 2026-09-02: "couldn't find key password in Secret
# bitbucket/bitbucket-sysadmin") or via a fully ExternalSecret-owned object
# (which worked, but wasn't wanted here) — dropped entirely.
# Same RDS admin credentials as rds-admin-credentials — every devtool
# connects to Postgres as the shared admin user, so there's no separate
# per-tool role to create (see devtools-definition/devtools/bitbucket).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitbucket-db
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: bitbucket-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.wrapper.rdsAdmin.usernameSsmParameter | quote }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.wrapper.rdsAdmin.passwordSsmParameter | quote }}
