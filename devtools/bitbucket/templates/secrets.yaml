{{- if .Values.wrapper.bitbucketSecrets.license }}
apiVersion: v1
kind: Secret
metadata:
  name: bitbucket-license
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  license-key: {{ .Values.wrapper.bitbucketSecrets.license | quote }}
---
{{- else if .Values.wrapper.bitbucketSecrets.licenseSsmParameter }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitbucket-license
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: bitbucket-license
    creationPolicy: Owner
  data:
    - secretKey: license-key
      remoteRef:
        key: {{ .Values.wrapper.bitbucketSecrets.licenseSsmParameter | quote }}
---
{{- end }}
# No password key here on purpose — Bitbucket's own one-time browser setup
# wizard sets the initial admin password on first login instead (same as
# Jira). A previous version of this Secret took a "password" key from an
# ExternalSecret, either patched via creationPolicy: Merge into this same
# plain Secret (raced with ArgoCD's own re-apply of the Secret's "data" map,
# which Server-Side Apply treats as atomic — ArgoCD's periodic sync
# repeatedly won the key back and wiped the merge, confirmed live
# 2026-09-02: "couldn't find key password in Secret
# bitbucket/bitbucket-sysadmin") or via a fully ExternalSecret-owned object
# (which worked, but wasn't wanted here) — dropped entirely rather than kept
# as either.
apiVersion: v1
kind: Secret
metadata:
  name: bitbucket-sysadmin
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ .Values.wrapper.bitbucketSecrets.admin.username | quote }}
  displayName: {{ .Values.wrapper.bitbucketSecrets.admin.displayName | quote }}
  emailAddress: {{ .Values.wrapper.bitbucketSecrets.admin.emailAddress | quote }}
---
# Same RDS admin credentials as rds-admin-credentials — every devtool
# connects to Postgres as the shared admin user, so there's no separate
# per-tool role to create (see devtools-definition/devtools/bitbucket).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitbucket-db
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: bitbucket-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.wrapper.rdsAdmin.usernameSsmParameter | quote }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.wrapper.rdsAdmin.passwordSsmParameter | quote }}
