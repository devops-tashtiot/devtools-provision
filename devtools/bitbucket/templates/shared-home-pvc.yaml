apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitbucket-shared-home
  namespace: {{ .Release.Namespace }}
spec:
  # ReadWriteMany, matching Confluence's and Jira's sharedHome — Atlassian's
  # documented Data Center "SHARED_STORAGE" pattern. Needs the EFS-backed
  # StorageClass (see devtools-definition/devtools/bitbucket/values.yaml);
  # plain EBS can't satisfy RWX.
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.bitbucket.volumes.sharedHome.storageClassName }}
  resources:
    requests:
      storage: 10Gi
